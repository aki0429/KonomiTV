
name: Publish Release

# 手動実行 or release ブランチへのリリースコミットの push で実行する
on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'リリースするバージョン (例: 0.14.1-iptv.1, v はつけない)'
        required: true
        default: ''

# ジョブの定義
jobs:

  # インストーラーのビルド
  ## このリポジトリ (フォーク) の build_installer.yaml を再利用する
  ## 本家 (tsukumijima/KonomiTV) のワークフローを参照すると本家のソースコードがビルドされてしまうため、必ず自前のものを参照する
  build_installer:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Release:')
    uses: ./.github/workflows/build_installer.yaml

  # ビルドが終わったら、タグ付けしてリリースを公開
  ## サードパーティーライブラリはこのフォークではビルドせず、インストール時に本家 master のビルド済みアーカイブを
  ## 取得する構成のため、リリースには添付しない (installer/Constants.py の定義を参照)
  publish_release:
    runs-on: ubuntu-22.04
    needs:
      - build_installer
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Release:')
    steps:

      # ビルド済みのインストーラーをダウンロード
      - name: Download Installer (for Windows)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer.exe
          path: ${{ github.workspace }}/
      - name: Download Installer (for Linux)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer.elf
          path: ${{ github.workspace }}/
      - name: Download Installer (for Linux ARM)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer-ARM.elf
          path: ${{ github.workspace }}/

      # リリースするバージョンを決定
      ## 手動実行時は入力値から、release ブランチへの push 時はリリースコミットのメッセージから取得する
      - name: Resolve Version
        id: resolve_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo version="$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            echo version="$(echo "$COMMIT_MESSAGE" | sed -e 's/Release: version //')" >> $GITHUB_OUTPUT
          fi

      # KonomiTV のソースコードをチェックアウト
      ## リリースのタグを対応するコミット (iptv-master ブランチ) に付けるために必要
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # リリースを作成
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'KonomiTV-Installer.exe,KonomiTV-Installer.elf,KonomiTV-Installer-ARM.elf'
          generateReleaseNotes: true
          name: KonomiTV IPTV Edition ${{ steps.resolve_version.outputs.version }}
          tag: v${{ steps.resolve_version.outputs.version }}
          commit: iptv-master
